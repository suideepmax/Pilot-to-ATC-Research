# S3-B3 FIXED: full decoder fine-tune, numerically stabilized version.
# See research_log/ISSUES.md ISS-011 for the root-cause writeup this config fixes.
#
# Differences from salm_uwb_atcc_full_decoder.yaml (the config that diverged
# to val_loss=inf at step 4000/10000 on 2026-09-09):
#   1. freeze_params: embed_tokens and llm.lm_head now explicitly frozen.
#      Qwen3 ties these two (tie_word_embeddings: true) but FSDP2 sharding
#      silently untied them, training 311M phantom duplicate params and
#      almost certainly producing the first `inf` via an unbounded 151936-row
#      output head. Freezing both sidesteps the bug entirely for this run.
#   2. optimizer: master_weight_adamw.MasterWeightAdamW instead of
#      torch.optim.AdamW. Plain AdamW under precision=16-true has no fp32
#      master weights, so exp_avg_sq underflows to exactly zero for this
#      model's real gradient magnitudes, degenerating AdamW into SGD at
#      lr/eps (=5.0 under the old config) -- survivable for LoRA's
#      zero-init adapter, destructive for full-parameter training.
#   3. lr: 1e-5 (was 5e-4). Once AdamW is real, |delta theta| ~= lr per step;
#      Qwen3's weight RMS is ~0.02 (initializer_range), so 5e-4 was a ~2.5%
#      per-step relative change -- enough to erase the pretrained model in
#      ~40 steps. 1e-5 gives ~0.05%/step, the standard full-FT range.
#   4. gradient clipping -- NOT set in this YAML's trainer block (must stay
#      absent: Lightning raises MisconfigurationException if
#      Trainer.gradient_clip_val and the module's own clip hook are both
#      set). STALE COMMENT CORRECTED (2026-09-11, ml-engineer audit): this
#      used to describe a separate scaled Lightning-native clip call at
#      value 0.5 -- that mechanism was REMOVED by the ISS-012 fix
#      (`configure_gradient_clipping` is no longer overridden at all, see
#      salm_train_stable.py's comment there). Clipping now happens entirely
#      inside on_before_optimizer_step, folded into MasterWeightAdamW's own
#      fp32 divide, at GRADIENT_CLIP_VAL (module constant in
#      salm_train_stable.py, currently 1000.0, Hydra-overridable via
#      model.gradient_clip_val_unscaled) -- nothing is scaled by LOSS_SCALE
#      separately; see this model's gradient_clip_val_unscaled key below.
#   5. warmup_steps: 2000 (was 1000) -- full FT needs a longer warmup than
#      LoRA's small adapter subspace.
#   6. val_check_interval: 250 (was 500) -- halves time-to-detection if
#      something still goes wrong.
#   7. Early stopping on divergence (check_finite + divergence_threshold),
#      so a bad run stops itself instead of running 19 hours before anyone
#      notices -- this exact protection did not exist for the run that failed.
#   8. explicit_log_dir isolated to experiments_s3b3_fixed/ (own directory,
#      per the v1/v3 collision lesson, ISS-010).
#
# Must be launched via salm_train_stable.py (StableSALM subclass), NOT the
# plain salm_train.py -- the loss-scaling / gradient-clip-scaling / grad-finite
# check only exist in the subclass.

model:
  pretrained_llm: Qwen/Qwen3-1.7B
  pretrained_asr: nvidia/canary-1b-flash
  pretrained_weights: True

  # Opt-in fix for ISS-013 (2026-09-11). The code's own default
  # (cfg.model.get("load_released_pretrained", False)) is False, so any
  # OTHER config that never sets this key (v1/v2/v3's separate yaml files,
  # or a stripped-down copy of this one) is completely unaffected -- nothing
  # retroactively changes for already-completed runs either (they're just
  # log files on disk). Set to True HERE, in this file specifically, because
  # this is the corrected recipe going forward for the S3-B3 full-decoder
  # track. When True, salm_train_stable.py loads
  # nvidia/canary-qwen-2.5b's ACTUAL trained modality-bridge and encoder
  # weights (plus its LoRA-merged decoder) on top of this fresh composition,
  # right after construction and before training starts -- per NVIDIA
  # maintainer piotrzelasko's documented guidance (HF discussions/13,
  # 2025-10-06: "set pretrained_weights: False and add 1 LOC to manually
  # load canary-qwen pretrained weights"). Without this, every condition in
  # this project (v1/v2/v3 included) starts the bridge from a random
  # initialization and uses canary-1b-flash's own (never further-adapted)
  # encoder rather than the released model's actual trained one -- a
  # documented pitfall, not a deliberate experimental choice. Verified
  # directly (2026-09-11) before enabling: the released model's LoRA-merged
  # state_dict has EXACTLY the same 1607 keys as this project's composed
  # architecture (0 differ either direction), and the DTensor-conversion
  # path this requires under FSDP2 was independently tested on a toy model
  # before being trusted here.
  load_released_pretrained: True

  freeze_params:
    - "^perception\\.preprocessor\\..+$"
    - "^perception\\.encoder\\..+$"
    - "^embed_tokens\\..+$"
    - "^llm\\.lm_head\\..+$"
  prevent_freeze_params: []

  prompt_format: qwen
  audio_locator_tag: "<|audioplaceholder|>"

  # Hydra-overridable mirror of salm_train_stable.py's GRADIENT_CLIP_VAL
  # module constant (2026-09-10). Default here matches the constant exactly
  # (1000.0) so leaving this unset changes nothing. Measured: clip_coef was
  # exactly 1 (never engaged) on every single step of both Gate 2 (497 steps)
  # and Gate 3 (842 steps) at this threshold -- a genuinely observed fact,
  # not proof that 1000 (or any lower candidate value) is correct. Per
  # external review: clipping cannot repair an already-nonfinite gradient or
  # an optimizer-state numerical failure, and being inactive on all OBSERVED
  # steps is not evidence about un-observed future gradient norms. A lower
  # value (e.g. 100, informed by Gate 2/3 grad_norm_unscaled percentiles) is
  # a candidate to be tested (does it measurably engage, does it change the
  # loss trajectory) via CLI override
  # (model.gradient_clip_val_unscaled=100.0), not to be silently substituted
  # here as an established repair.
  gradient_clip_val_unscaled: 1000.0

  perception:
    target: nemo.collections.speechlm2.modules.perception.AudioPerceptionModule
    output_dim: 2048
    modality_adapter:
      _target_: nemo.collections.speechlm2.modules.perception.IdentityConnector
      d_model: 1024

  optimizer:
    _target_: master_weight_adamw.MasterWeightAdamW
    lr: 1e-5
    betas: [0.9, 0.98]
    weight_decay: 0.0
    eps: 1e-8
    loss_scale: 1024.0

  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.CosineAnnealing
    # warmup_steps 2000 -> 500 (2026-09-11, systems-architect audit): 2000
    # was never actually tested at ANY scale -- Gate 2 used 100, Gate 3 used
    # 500, and 2000 was carried forward as an untested "20%-of-budget"
    # convention. Gate 3 cleared its entire early-instability transient
    # (grad_norm p90 223 in the first 100 steps, down to <=10.5 by step 800)
    # with exactly 1 skipped step under warmup=500. Against 2000: effective
    # batch 32, ~10,619-cut train set -> ~332 optimizer steps/epoch, so
    # warmup=2000 is 6.0 data epochs at sub-peak LR (~11.6h wall clock) on a
    # run whose best-so-far point (Gate 3 step 750) arrived at only 2.3
    # epochs -- i.e. the untested longer warmup would consume most of the
    # run's historically-informative training window. 500/10000=5% remains
    # conservative against standard full-FT convention (1-3%).
    warmup_steps: 500
    min_lr: 1e-7
    max_steps: ${trainer.max_steps}

trainer:
  devices: 4
  accelerator: gpu
  num_nodes: 1
  precision: 16-true
  logger: False
  enable_checkpointing: False
  use_distributed_sampler: False
  max_steps: 10000
  limit_train_batches: 1000
  # val_check_interval REMOVED (2026-09-11, systems-architect + ml-engineer
  # audits, both independently confirmed): this key is counted in
  # TRAINING-BATCH units, not optimizer steps -- at 250 with
  # accumulate_grad_batches=8 that fired every ~31 optimizer steps (320
  # validations over the full 10,000-step budget), and separately fed a
  # since-removed "recovery checkpoint" callback that read it as
  # OPTIMIZER-step units (an 8x unit mismatch bug, now moot since that
  # callback was removed as redundant with NeMo's own always-on
  # `-last.ckpt` full-state save -- see salm_train_stable.py). Leaving this
  # key absent falls back to Lightning's default val_check_interval=1.0 ->
  # once per epoch -> once per limit_train_batches=1000 batches -> every 125
  # optimizer steps (80 validations over the full run) -- a coarser but
  # correctly-understood cadence, and each dev-set estimate gets 4x more
  # limit_val_batches (below) for the same total validation compute.
  limit_val_batches: 200
  # limit_val_batches raised 50 -> 200 (2026-09-11, systems-architect audit):
  # this value is PER RANK (NeMo's DataModule shards validation by
  # global_rank/world_size), so 50 meant 50*4=200 of dev_cuts.jsonl.gz's 915
  # cuts (22%) per check. Gate 3's stopping decision turned on
  # val_loss deltas of 0.003-0.014 -- the same order as a 200-cut sampling
  # noise floor -- so the validation set could not resolve the signal the
  # early-stopping decision depended on. 200/rank covers 800/915 (87%).
  # HARD CEILING: do not raise above 228. dev_cuts.jsonl.gz has 915 cuts;
  # sharded across 4 ranks that is 229/229/229/228. Any per-rank limit >=229
  # lets ranks run unequal batch counts, and FSDP2's forward pass is
  # collective -- the short rank stops participating mid-validation while
  # the others continue, causing an NCCL hang (same failure class as the
  # ISS-011-follow-up collective-desync hang). 200 leaves margin below 228.
  log_every_n_steps: 50
  num_sanity_val_steps: 1
  # Deliberately NOT set here (must stay None/absent) -- clipping happens
  # entirely inside StableSALM's on_before_optimizer_step, folded into
  # MasterWeightAdamW's own fp32 divide (GRADIENT_CLIP_VAL / the Hydra
  # override model.gradient_clip_val_unscaled below), NOT via Lightning's
  # native clip_gradients() hook (removed by the ISS-012 fix -- see
  # salm_train_stable.py's comment on why configure_gradient_clipping is no
  # longer overridden). Lightning raises MisconfigurationException if both
  # Trainer.gradient_clip_val and a module clip hook are set at once, so
  # this must stay absent regardless.
  # accumulate_grad_batches raised 4->8 and train_ds.batch_size lowered
  # 2->1 below (same effective batch = 1*8*4 GPUs = 32, was 2*4*4 = 32)
  # after Gate 1 hit CUDA OOM: fp32 master weights + fp32 exp_avg/exp_avg_sq
  # in MasterWeightAdamW roughly double the optimizer's memory footprint
  # vs the plain fp16 AdamW the old full_decoder.yaml used.
  accumulate_grad_batches: 8
  strategy:
    _target_: lightning.pytorch.strategies.ModelParallelStrategy
    tensor_parallel_size: 1
    data_parallel_size: 4

data:
  train_ds:
    sample_rate: 16000
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: 0.08
    input_cfg:
      - type: lhotse_as_conversation
        # Changed from train_cuts.jsonl.gz (2026-09-10, GPT-6 Astra review +
        # user-directed fix): the original file included 178 sessions (0.85h)
        # now carved out as a proper held-out dev split (see
        # make_dev_split.py) AND one session (uwb-atcc_ACCU-pwnH5N) that was
        # also present in test_cuts.jsonl.gz -- an existing train/test leak,
        # fixed as a byproduct. Verified zero session-level overlap among
        # train_cuts_v2/dev_cuts/test_cuts directly (not inferred).
        cuts_path: /home/kotasthane/canary-ft/data/train_cuts_v2.jsonl.gz
        audio_locator_tag: ${model.audio_locator_tag}
        tags:
          context: "Transcribe the following:"
    seed: 1234
    shuffle: true
    shard_seed: "randomized"
    num_workers: 1
    batch_size: 1

  validation_ds:
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: 0.08
    datasets:
      uwb_atcc_dev:
        input_cfg:
          - type: lhotse_as_conversation
            # Changed from test_cuts.jsonl.gz (2026-09-10): validation_ds
            # drives early stopping AND checkpoint selection, both of which
            # are model-selection decisions -- using the final test set for
            # those is data leakage into the reported metric, even though no
            # gradient ever touches it. Gate 2/3/the bridge-LR ablation
            # already ran against test_cuts.jsonl.gz before this fix; that
            # limitation is disclosed in research_log/VALIDATION.md, not
            # silently erased. test_cuts.jsonl.gz itself is untouched.
            cuts_path: /home/kotasthane/canary-ft/data/dev_cuts.jsonl.gz
            audio_locator_tag: ${model.audio_locator_tag}
            tags:
              context: "Transcribe the following:"
    sample_rate: 16000
    batch_size: 1
    seed: 1234
    # Fixed (was "randomized"): ISS-011 follow-up #3 -- Gate 1/2 best-score
    # val_loss spanned 12.418-12.848 (~0.2-0.4 spread) across otherwise
    # near-identical short runs purely from which 50 utterances got sampled
    # each time. A fixed shard_seed makes every validation pass see the same
    # subset, so check-to-check differences reflect the model, not the sample.
    shard_seed: 1234

exp_manager:
  exp_dir: null
  explicit_log_dir: /home/kotasthane/canary-ft/experiments_s3b3_fixed/
  name: canary_uwb_atcc_s3b3_fixed
  create_tensorboard_logger: False
  create_checkpoint_callback: true
  use_datetime_version: true
  max_time_per_run: "02:00:00:00"
  resume_if_exists: false
  resume_ignore_no_checkpoint: true
  create_wandb_logger: false
  create_early_stopping_callback: true
  early_stopping_callback_params:
    monitor: val_loss
    mode: min
    # REVERTED 0.3 -> 0.0 (2026-09-10, external review + user correction):
    # raising min_delta was backwards reasoning. For Lightning's EarlyStopping
    # in mode='min', a LARGER min_delta requires a BIGGER decrease to count as
    # "improvement" -- so it makes premature stopping on real-but-modest gains
    # MORE likely, not less. The original intent (don't stop purely on
    # validation-sampling noise) is better served by leaving min_delta at 0.0
    # and, for short diagnostic/gate runs specifically, overriding
    # exp_manager.create_early_stopping_callback=false via the CLI instead of
    # tuning this threshold -- diagnostic runs should run their full step
    # budget regardless of val_loss behavior, per ISS-012.
    min_delta: 0.0
    patience: 3
    check_finite: true
    # 1.2 (Opus's original suggestion) assumed a near-converged reference
    # loss (v1 converges to ~0.7-0.8) -- it fired as a false positive at
    # optimizer step 25/2000 warmup (LR ~1.25e-7, model barely perturbed
    # from pretrained), where val_loss=12.68 is just the natural high loss
    # of an essentially-untrained model (consistent with the zero-shot
    # baseline's poor 81.49% WER), not real divergence. Raised to a value
    # that only catches genuine blow-up; check_finite=true remains the
    # real safety net for actual NaN/inf.
    divergence_threshold: 20.0
  checkpoint_callback_params:
    filename: "{step}"
    monitor: val_loss
    mode: min
    # every_n_train_steps=500 (was) gated Lightning's ModelCheckpoint via
    # on_train_batch_end's `trainer.global_step % every_n_train_steps == 0`
    # -- a check entirely independent of when validation actually ran.
    # Verified directly (2026-09-10, GPT-6 Astra review): Gate 3's true best
    # val_loss (0.754) occurred at step 750, which is NOT a multiple of 500,
    # so it was never even considered for a top-k save; only step=500 (worse)
    # and step=843-last (post-plateau) exist on disk, and the actual best
    # checkpoint cannot be recovered.
    # Fix: leave both every_n_train_steps and every_n_epochs null/None.
    # Lightning's ModelCheckpoint.__init_triggers then defaults to
    # every_n_epochs=1, every_n_train_steps=0 -- which makes on_validation_end
    # (not on_train_batch_end) the sole top-k-save trigger, firing after
    # EVERY validation call regardless of step-count alignment. Confirmed via
    # direct read of lightning/pytorch/callbacks/model_checkpoint.py
    # (on_validation_end / on_train_batch_end / __init_triggers), not assumed.
    every_n_train_steps: null
    every_n_epochs: null
    save_top_k: 3
    always_save_nemo: false
    save_nemo_on_train_end: false
