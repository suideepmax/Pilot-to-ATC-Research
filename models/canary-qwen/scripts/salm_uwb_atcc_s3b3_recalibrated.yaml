# S3-B3 RECALIBRATED: same corrected-init full-decoder recipe as
# salm_uwb_atcc_s3b3_fixed.yaml (ISS-013's NVIDIA-documented pretrained-weight
# fix, MasterWeightAdamW, freeze_params, etc. -- all unchanged), but with two
# additional fixes made after inspecting experiments_s3b3_production_v2's
# actual trajectory (research_log/VALIDATION.md VAL-022):
#
#   1. max_steps 10000 -> 2000, warmup_steps 500 -> 100 (2026-09-11).
#      train_cuts_v2.jsonl.gz has 10,619 cuts; effective batch = 32
#      (batch_size=1 x accumulate_grad_batches=8 x 4 GPUs) -> ~332 optimizer
#      steps per TRUE data epoch. production_v2's best val_loss (0.6588)
#      arrived at step=625 (~1.9 true epochs); by step=1000 (~3.0 epochs) it
#      had already cycled the training set 3x and was monotonically
#      worsening (train_loss_unscaled down to 0.0006-0.03 -- memorized).
#      Under the OLD max_steps=10000 schedule, cosine annealing was only
#      6.25% through its decay at step=625 (LR still ~99% of peak) -- the
#      decay never got a chance to act before the useful window closed.
#      2000 steps = ~6.0 true epochs, so the SAME cosine schedule now
#      completes its decay within a realistic training-before-overfitting
#      window instead of sitting near peak throughout. warmup_steps scaled
#      proportionally (500/10000=5% -> 100/2000=5%, same fraction, per the
#      s3b3_fixed.yaml precedent for that ratio).
#
#   2. model.optimizer.bridge_lr: 5e-4 -> 5e-5 (2026-09-11).
#      BRIDGE_LR=5e-4 (50x the base decoder lr=1e-5) is salm_train_stable.py's
#      module-constant default. Its ENTIRE justification (see that file's
#      comment above BRIDGE_PARAM_PATTERN) is that the bridge is normally
#      RANDOMLY initialized and needs an aggressive LR to learn a useful
#      mapping from scratch quickly. That justification no longer applies to
#      THIS config: model.load_released_pretrained=True means the bridge
#      starts from nvidia/canary-qwen-2.5b's actual TRAINED bridge weights,
#      not random ones. production_v2 ran with the stale 50x multiplier
#      anyway (no bridge_lr override existed in salm_uwb_atcc_s3b3_fixed.yaml)
#      -- i.e. an already-good bridge was hit with 50x the base LR for its
#      entire run, a plausible contributor to (not yet isolated as the sole
#      cause of) the rapid post-peak degradation. 5e-5 (10x base, not 50x) is
#      a reasoned compromise -- the bridge is a small, lower-capacity module
#      that may still benefit from adapting faster than the full decoder to
#      this domain's acoustic conditions, but should not be trained as if
#      starting from scratch. This is a HYPOTHESIS, not yet ablated in
#      isolation from fix #1 above -- if this run's trajectory still shows
#      rapid post-peak degradation, re-test with bridge_lr held at the old
#      5e-4 (isolating fix #1 alone) before concluding fix #2 helped.
#
# See salm_uwb_atcc_s3b3_fixed.yaml's own header for the full history this
# config inherits (ISS-011 numerical-stability fixes, ISS-013 init fix, etc.)
# -- not re-documented here to avoid drift between the two files.

model:
  pretrained_llm: Qwen/Qwen3-1.7B
  pretrained_asr: nvidia/canary-1b-flash
  pretrained_weights: True
  load_released_pretrained: True

  freeze_params:
    - "^perception\\.preprocessor\\..+$"
    - "^perception\\.encoder\\..+$"
    - "^embed_tokens\\..+$"
    - "^llm\\.lm_head\\..+$"
  prevent_freeze_params: []

  prompt_format: qwen
  audio_locator_tag: "<|audioplaceholder|>"

  gradient_clip_val_unscaled: 1000.0

  perception:
    target: nemo.collections.speechlm2.modules.perception.AudioPerceptionModule
    output_dim: 2048
    modality_adapter:
      _target_: nemo.collections.speechlm2.modules.perception.IdentityConnector
      d_model: 1024

  optimizer:
    _target_: master_weight_adamw.MasterWeightAdamW
    lr: 1e-5
    bridge_lr: 5e-5
    betas: [0.9, 0.98]
    weight_decay: 0.0
    eps: 1e-8
    loss_scale: 1024.0

  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.CosineAnnealing
    warmup_steps: 100
    min_lr: 1e-7
    max_steps: ${trainer.max_steps}

trainer:
  devices: 4
  accelerator: gpu
  num_nodes: 1
  precision: 16-true
  logger: False
  enable_checkpointing: False
  use_distributed_sampler: False
  max_steps: 2000
  limit_train_batches: 1000
  limit_val_batches: 200
  log_every_n_steps: 50
  num_sanity_val_steps: 1
  accumulate_grad_batches: 8
  strategy:
    _target_: lightning.pytorch.strategies.ModelParallelStrategy
    tensor_parallel_size: 1
    data_parallel_size: 4

data:
  train_ds:
    sample_rate: 16000
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: 0.08
    input_cfg:
      - type: lhotse_as_conversation
        cuts_path: /home/kotasthane/canary-ft/data/train_cuts_v2.jsonl.gz
        audio_locator_tag: ${model.audio_locator_tag}
        tags:
          context: "Transcribe the following:"
    seed: 1234
    shuffle: true
    shard_seed: "randomized"
    num_workers: 1
    batch_size: 1

  validation_ds:
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: 0.08
    datasets:
      uwb_atcc_dev:
        input_cfg:
          - type: lhotse_as_conversation
            cuts_path: /home/kotasthane/canary-ft/data/dev_cuts.jsonl.gz
            audio_locator_tag: ${model.audio_locator_tag}
            tags:
              context: "Transcribe the following:"
    sample_rate: 16000
    batch_size: 1
    seed: 1234
    shard_seed: 1234

exp_manager:
  exp_dir: null
  explicit_log_dir: /home/kotasthane/canary-ft/experiments_s3b3_recalibrated/
  name: canary_uwb_atcc_s3b3_recalibrated
  create_tensorboard_logger: False
  create_checkpoint_callback: true
  use_datetime_version: true
  max_time_per_run: "02:00:00:00"
  resume_if_exists: false
  resume_ignore_no_checkpoint: true
  create_wandb_logger: false
  create_early_stopping_callback: true
  early_stopping_callback_params:
    monitor: val_loss
    mode: min
    min_delta: 0.0
    patience: 100000
    check_finite: true
    divergence_threshold: 50.0
  checkpoint_callback_params:
    filename: "{step}"
    monitor: val_loss
    mode: min
    every_n_train_steps: null
    every_n_epochs: null
    save_top_k: 3
    always_save_nemo: false
    save_nemo_on_train_end: false
