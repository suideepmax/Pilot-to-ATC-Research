# Full decoder fine-tune (Adaptation-Scope Branch 3, research_report/FINAL_RESEARCH_PROGRAM.md Section 6).
# Deliberately NOT named v1/v2/v3/v4 to avoid colliding with the existing canonical
# naming scheme -- this is a separate adaptation-scope experiment, not a fourth
# "version" of the same baseline.
#
# Design intent: isolate ADAPTATION SCOPE alone as the single variable vs. v1.
# Everything else (optimizer, LR, data, regularization-off) is held identical to
# v1 (salm_uwb_atcc_v1.yaml) on purpose -- do not add SpecAugment/dropout/weight_decay
# changes here, that would confound this experiment with the separate regularization
# ablation (v3 / EXP-010 Section 7).
#
# freeze_params below and the absence of a `lora:` block were verified via Spike D
# (research_log/VALIDATION.md VAL-009): 1-step smoke test confirmed this exact
# freeze pattern produces 2,033,839,104 trainable params (llm + embed_tokens),
# matching the intended "unfreeze the whole decoder" config, and fits in VRAM on
# 4x RTX 2080 Ti via FSDP. This file extends that smoke-test config to a full
# 10,000-step run -- NOT YET LAUNCHED, config only as of 2026-09-08.

model:
  pretrained_llm: Qwen/Qwen3-1.7B
  pretrained_asr: nvidia/canary-1b-flash
  pretrained_weights: True

  # Only the encoder stays frozen. llm and embed_tokens are NOT in this list,
  # so the entire Qwen3-1.7B decoder trains directly (no LoRA -- no `lora:`
  # block below, so maybe_install_lora() in
  # nemo/collections/speechlm2/parts/lora.py skips PEFT wrapping entirely).
  freeze_params:
    - "^perception\\.preprocessor\\..+$"
    - "^perception\\.encoder\\..+$"
  prevent_freeze_params: []

  prompt_format: qwen
  audio_locator_tag: "<|audioplaceholder|>"

  # NOTE: deliberately no `lora:` block -- see freeze_params comment above.

  perception:
    target: nemo.collections.speechlm2.modules.perception.AudioPerceptionModule
    output_dim: 2048
    modality_adapter:
      _target_: nemo.collections.speechlm2.modules.perception.IdentityConnector
      d_model: 1024

  # Identical to v1's optimizer settings -- adaptation scope is the only
  # variable under test here.
  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-4
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    eps: 1e-4  # higher epsilon for fp16 stability (default 1e-8 causes overflow)

  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.CosineAnnealing
    warmup_steps: 1000
    min_lr: 1e-6
    max_steps: ${trainer.max_steps}

trainer:
  devices: 4
  accelerator: gpu
  num_nodes: 1
  precision: 16-true
  logger: False
  enable_checkpointing: False
  use_distributed_sampler: False
  max_steps: 10000
  limit_train_batches: 1000
  val_check_interval: 500
  limit_val_batches: 50
  log_every_n_steps: 50
  num_sanity_val_steps: 1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 4
  strategy:
    _target_: lightning.pytorch.strategies.ModelParallelStrategy
    tensor_parallel_size: 1
    data_parallel_size: 4

data:
  train_ds:
    sample_rate: 16000
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: 0.08
    input_cfg:
      - type: lhotse_as_conversation
        cuts_path: /home/kotasthane/canary-ft/data/train_cuts.jsonl.gz
        audio_locator_tag: ${model.audio_locator_tag}
        tags:
          context: "Transcribe the following:"
    seed: 1234
    shuffle: true
    shard_seed: "randomized"
    num_workers: 1
    batch_size: 2

  validation_ds:
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: 0.08
    datasets:
      uwb_atcc_test:
        input_cfg:
          - type: lhotse_as_conversation
            cuts_path: /home/kotasthane/canary-ft/data/test_cuts.jsonl.gz
            audio_locator_tag: ${model.audio_locator_tag}
            tags:
              context: "Transcribe the following:"
    sample_rate: 16000
    batch_size: 1
    seed: 1234
    shard_seed: "randomized"

exp_manager:
  # Deliberately isolated from v1 (~/canary-ft/experiments/) and v2
  # (~/canary-ft/experiments_v2/) -- a distinct top-level directory, learned
  # from the v1/v3 checkpoint near-miss this session (research_log/ISSUES.md
  # ISS-009 correction). `name` alone does NOT isolate output paths in this
  # exp_manager setup -- explicit_log_dir is what actually matters.
  exp_dir: null
  explicit_log_dir: /home/kotasthane/canary-ft/experiments_full_decoder/
  name: canary_uwb_atcc_full_decoder
  create_tensorboard_logger: False
  create_checkpoint_callback: true
  use_datetime_version: true
  max_time_per_run: "02:00:00:00"
  resume_if_exists: false
  resume_ignore_no_checkpoint: true
  create_wandb_logger: false
  checkpoint_callback_params:
    filename: "{step}"
    monitor: val_loss
    mode: min
    every_n_train_steps: 500
    every_n_epochs: null
    save_top_k: -1
    always_save_nemo: false
    save_nemo_on_train_end: false
