# Regularization-decomposition ablation A: SpecAugment ONLY, isolated from
# v3's other two changes (2026-09-22, reviewer question about which of v3's
# three simultaneous changes -- SpecAugment, LoRA dropout 0.01->0.1,
# weight_decay 1e-3->1e-2 -- actually drove its 23.32%->20.70% improvement).
#
# Weight decay is already ruled out with certainty (ISS-011: numerically
# inert in this plain fp16 AdamW at these magnitudes, verified directly via
# torch.tensor(1 - 5e-4*1e-3, dtype=float16) == 1.0). This leaves SpecAugment
# vs. dropout as the open question this config and its dropout-only sibling
# (salm_uwb_atcc_v3_dropout_only.yaml) are built to answer.
#
# Exact minimal diff from salm_uwb_atcc_v1.yaml (verified via diff before
# writing this file): ONLY the spec_augment block is added. lora_dropout
# stays at v1's 0.01, weight_decay stays at v1's 1e-3, optimizer/lr/schedule/
# trainer/data are otherwise byte-identical to v1. Uses the exact same stock
# NeMo training script v1/v3 actually used (~/NeMo/examples/speechlm2/
# salm_train.py, confirmed unmodified since -- md5 3f523c0391e49c78f9b97564cacce9f4,
# last touched 2026-03-26, predating this session), NOT this project's own
# salm_train_stable.py (which has since diverged: MasterWeightAdamW,
# ISS-012's clip-grad fix, etc.) -- using the modified script would introduce
# a script-identity confound on top of the regularization question this
# ablation is meant to isolate.
#
# DEADLINE-DRIVEN SCOPE CAVEAT (explicit, not hidden): v1/v3's original
# comparison trained to 10,000 steps (~21h on 4x RTX 2080 Ti per
# train_canary_v1.sh's own documented timing). Two full 10,000-step ablations
# would need ~42h sequential (4 GPUs required for each), which does not fit
# the remaining time before the ICASSP 2027 deadline. This run is
# DELIBERATELY TRUNCATED to max_steps=500 (v1's own first checkpoint/
# val_check_interval boundary) -- a SHORT, DIRECTIONAL/SUGGESTIVE signal only,
# NOT a definitive decomposition at matched exposure. Must be reported in the
# manuscript with this caveat explicit, per the user's own instruction when
# this scope was chosen.

model:
  pretrained_llm: Qwen/Qwen3-1.7B
  pretrained_asr: nvidia/canary-1b-flash
  pretrained_weights: True

  freeze_params:
    - "^llm\\..+$"
    - "^embed_tokens\\..+$"
    - "^perception\\.preprocessor\\..+$"
    - "^perception\\.encoder\\..+$"
  prevent_freeze_params: []

  prompt_format: qwen
  audio_locator_tag: "<|audioplaceholder|>"

  lora:
    task_type: CAUSAL_LM
    r: 128
    lora_alpha: 256
    lora_dropout: 0.01
    target_modules: ["q_proj", "v_proj"]

  perception:
    target: nemo.collections.speechlm2.modules.perception.AudioPerceptionModule
    output_dim: 2048
    modality_adapter:
      _target_: nemo.collections.speechlm2.modules.perception.IdentityConnector
      d_model: 1024
    spec_augment:
      _target_: nemo.collections.asr.modules.SpectrogramAugmentation
      freq_masks: 2
      time_masks: 10
      freq_width: 27
      time_width: 5

  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-4
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    eps: 1e-4

  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.CosineAnnealing
    warmup_steps: 1000
    min_lr: 1e-6
    max_steps: ${trainer.max_steps}

trainer:
  devices: 4
  accelerator: gpu
  num_nodes: 1
  precision: 16-true
  logger: False
  enable_checkpointing: False
  use_distributed_sampler: False
  max_steps: 500
  limit_train_batches: 1000
  val_check_interval: 500
  limit_val_batches: 50
  log_every_n_steps: 50
  num_sanity_val_steps: 1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 4
  strategy:
    _target_: lightning.pytorch.strategies.ModelParallelStrategy
    tensor_parallel_size: 1
    data_parallel_size: 4

data:
  train_ds:
    sample_rate: 16000
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: 0.08
    input_cfg:
      - type: lhotse_as_conversation
        cuts_path: /home/kotasthane/canary-ft/data/train_cuts.jsonl.gz
        audio_locator_tag: ${model.audio_locator_tag}
        tags:
          context: "Transcribe the following:"
    seed: 1234
    shuffle: true
    shard_seed: "randomized"
    num_workers: 1
    batch_size: 2

  validation_ds:
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: 0.08
    datasets:
      uwb_atcc_test:
        input_cfg:
          - type: lhotse_as_conversation
            cuts_path: /home/kotasthane/canary-ft/data/test_cuts.jsonl.gz
            audio_locator_tag: ${model.audio_locator_tag}
            tags:
              context: "Transcribe the following:"
    sample_rate: 16000
    batch_size: 1
    seed: 1234
    shard_seed: "randomized"

exp_manager:
  exp_dir: null
  explicit_log_dir: /home/kotasthane/canary-ft/experiments_v3_specaugment_only/
  name: canary_uwb_atcc_v3_specaugment_only
  create_tensorboard_logger: False
  create_checkpoint_callback: true
  use_datetime_version: true
  max_time_per_run: "02:00:00:00"
  resume_if_exists: false
  resume_ignore_no_checkpoint: true
  create_wandb_logger: false
  checkpoint_callback_params:
    filename: "{step}"
    monitor: val_loss
    mode: min
    every_n_train_steps: 500
    every_n_epochs: null
    save_top_k: -1
    always_save_nemo: false
    save_nemo_on_train_end: false
